<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Rayane Store</title>
  <meta name="description" content="Moda feminina escolhida peça por peça. Fale com a Rayane Store pelo WhatsApp, Instagram e mais." />
  <meta name="theme-color" content="#F6EFEA" />
  <!-- Política de segurança: só scripts deste site; conexões só com o Supabase e o serviço de localização -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.supabase.co; font-src 'self'; connect-src 'self' https://*.supabase.co https://get.geojs.io; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Rayane Store" />
  <meta property="og:description" content="Moda feminina escolhida peça por peça." />
  <meta property="og:image" content="assets/logo.png" />

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23942C9D' d='M16 28s-11-6.6-11-14.2C5 9.4 8 7 11.2 7c2.3 0 3.9 1.3 4.8 2.9C16.9 8.3 18.5 7 20.8 7 24 7 27 9.4 27 13.8 27 21.4 16 28 16 28z'/%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" href="assets/logo.png" />

  <link rel="preconnect" href="https://dzaritftijhlcjdenjir.supabase.co" crossorigin />
  <link rel="preload" href="assets/fonts/jost.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
  <button class="share-btn" id="shareBtn" type="button" aria-label="Compartilhar esta página">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7.5 7.5 12 3l4.5 4.5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>
  </button>

  <main class="page">
    <header class="profile">
      <h1 class="logo">
        <img src="assets/logo.png" width="480" height="393" alt="Rayane Store" fetchpriority="high" />
      </h1>
      <p class="bio" id="bio"></p>
      <p class="status" id="status" hidden></p>
      <div class="hours" id="hours" hidden></div>
      <nav class="socials" id="socials" aria-label="Redes sociais"></nav>
    </header>

    <section class="rack" aria-label="Links">
      <div class="rail" aria-hidden="true"></div>
      <ul class="links" id="links"></ul>
    </section>

    <footer class="foot">
      <span id="year"></span> <span id="footName">Rayane Store</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-8.5-5.1-8.5-11A4.8 4.8 0 0 1 12 7.1 4.8 4.8 0 0 1 20.5 10c0 5.9-8.5 11-8.5 11z"/></svg>
    </footer>
  </main>

  <div class="sheet" id="sheet" hidden>
    <div class="sheet__backdrop" data-close></div>
    <div class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <button class="sheet__x" type="button" data-close aria-label="Fechar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      <h2 id="sheetTitle">Compartilhar</h2>

      <div class="qr">
        <div class="qr__code" id="qr" aria-label="QR code da página"></div>
        <p>Aponte a câmera para abrir</p>
      </div>

      <div class="sheet__actions">
        <button type="button" id="copyLink">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>
          <span>Copiar link</span>
        </button>
        <a id="shareWa" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" aria-hidden="true" class="fill"><path d="M17.5 14.4c-.3-.1-1.8-.9-2-1-.3-.1-.5-.1-.7.1-.2.3-.8 1-.9 1.2-.2.2-.3.2-.6.1-.3-.1-1.3-.5-2.4-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.6l.5-.5c.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5l-.9-2.2c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.1.2 2.1 3.2 5.1 4.5.7.3 1.3.5 1.7.6.7.2 1.4.2 1.9.1.6-.1 1.8-.7 2-1.4.2-.7.2-1.3.2-1.4-.1-.1-.3-.2-.6-.3zM12 21.8c-1.8 0-3.5-.5-5-1.4l-.4-.2-3.7 1 1-3.6-.2-.4A9.8 9.8 0 1 1 12 21.8zM12 .2A11.8 11.8 0 0 0 1.8 17.8L.2 23.8l6.1-1.6A11.8 11.8 0 1 0 12 .2z"/></svg>
          <span>Enviar no WhatsApp</span>
        </a>
        <button type="button" id="nativeShare" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="m8.2 10.8 7.6-4.4M8.2 13.2l7.6 4.4"/></svg>
          <span>Mais opções</span>
        </button>
        <button type="button" id="saveContact">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="8" r="4"/><path d="M3 20c.8-3.6 3.6-6 7-6s6.2 2.4 7 6M19 8v6M16 11h6"/></svg>
          <span>Salvar contato</span>
        </button>
      </div>
    </div>
  </div>

  <div class="sheet" id="waSheet" hidden>
    <div class="sheet__backdrop" data-close></div>
    <div class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="waTitle">
      <button class="sheet__x" type="button" data-close aria-label="Fechar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      <h2 id="waTitle">Falar no WhatsApp</h2>
      <p class="sheet__sub" id="waSub">Escolha a loja mais perto de você</p>
      <div class="branches" id="branches"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="supabase-config.js" defer></script>
  <script src="api.js" defer></script>
  <script src="icons.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
